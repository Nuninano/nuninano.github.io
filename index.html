<!DOCTYPE html>
<html lang="es">
<head>
<meta name="google-site-verification" content="kY9kScY7Ylx-RqRbYpUiAQNyfvbkqsEQ8K7rkvZjlZ0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuninano Hub</title>

<!-- PWA Manifest & Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuninano">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%23000000'/%3E%3Cg stroke='%23FFFFFF' stroke-width='28' stroke-linecap='round' fill='none'%3E%3Cellipse cx='260' cy='256' rx='175' ry='205' transform='rotate(-18 260 256)'/%3E%3Cline x1='250' y1='120' x2='200' y2='230'/%3E%3Cline x1='310' y1='165' x2='260' y2='275'/%3E%3Cpath d='M 160 260 C 135 370, 220 400, 270 340'/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">

<style>
:root {
  --bg-body: #0f0f0f;
  --bg-header: #181818;
  --bg-card: #141414;
  --bg-card-active: #0d221e;
  --bg-card-hover: #1a1a1a;
  --bg-input: #0a0a0a;
  --bg-btn-sec: #222;
  --border-color: #262626;
  --border-btn: #333;
  --text-main: #ffffff;
  --text-muted: #888888;
  --accent-color: #00ffd5;
  --accent-btn: #00a884;
  --accent-hover: #00ffd5;
}

body.light-mode {
  --bg-body: #f4f4f5;
  --bg-header: #e4e4e7;
  --bg-card: #ffffff;
  --bg-card-active: #e6f7f3;
  --bg-card-hover: #f8fafc;
  --bg-btn-sec: #e4e4e7;
  --border-color: #d4d4d8;
  --border-btn: #cbd5e1;
  --text-main: #18181b;
  --text-muted: #71717a;
  --accent-color: #008a6e;
  --accent-btn: #008a6e;
  --accent-hover: #006e58;
}

body.pure-black-mode {
  --bg-body: #000000;
  --bg-header: #000000;
  --bg-card: #050505;
  --bg-card-active: #00221c;
  --bg-card-hover: #0c0c0c;
  --bg-btn-sec: #111111;
  --border-color: #1c1c1c;
  --border-btn: #222222;
  --text-main: #ffffff;
  --text-muted: #666666;
  --accent-color: #00ffd5;
  --accent-btn: #00a884;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg-body);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
}

.header-brand { display: flex; align-items: center; gap: 8px; }
.header-title { font-size: 15px; font-weight: 700; color: var(--text-muted); }

.icon-btn {
  background: var(--bg-btn-sec);
  border: 1px solid var(--border-btn);
  color: var(--text-main);
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

main {
  flex: 1;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 8px;
}

.projects-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: all 0.25s ease;
}

.project-card:hover {
  border-color: var(--accent-btn);
  background: var(--bg-card-hover);
}

.project-title {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.project-creator {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 2px;
  display: block;
}

.badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
  text-transform: uppercase;
}

.badge-compliant { background: rgba(0, 255, 213, 0.15); color: var(--accent-color); border: 1px solid var(--accent-btn); }
.badge-non-compliant { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #991b1b; }

.project-desc { font-size: 13px; color: var(--text-muted); margin: 0; }

.btn-primary {
  background: var(--accent-btn);
  color: #fff;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 700;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.open { display: flex; }

.sandbox-container {
  width: 100%;
  max-width: 1000px;
  height: 90vh;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sandbox-header {
  padding: 10px 16px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--border-color);
  background: var(--bg-header);
  margin-top: auto;
}

@media (min-width: 900px) {
  .projects-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<header>
  <div class="header-brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="24" height="24">
      <rect width="512" height="512" rx="108" fill="#000000"/>
      <g stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" fill="none">
        <ellipse cx="260" cy="256" rx="175" ry="205" transform="rotate(-18 260 256)"/>
        <line x1="250" y1="120" x2="200" y2="230"/>
        <line x1="310" y1="165" x2="260" y2="275"/>
        <path d="M 160 260 C 135 370, 220 400, 270 340"/>
      </g>
    </svg>
    <span class="header-title">Nuninano Hub</span>
  </div>
</header>

<main>
  <section>
    <div class="section-header">
      <span>Explorar Contenido</span>
      <span id="appCountTag">0 Cargados</span>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>
</main>

<footer>© Nuninano — Todos los derechos reservados.</footer>

<!-- Modal Sandbox (Juegos no adaptados) -->
<div id="sandboxModal" class="modal-overlay">
  <div class="sandbox-container">
    <div class="sandbox-header">
      <span id="sandboxTitle" style="font-weight: bold; font-size: 14px;">Visor de Juego</span>
      <button class="icon-btn" onclick="closeSandbox()">✕ Cerrar</button>
    </div>
    <iframe id="sandboxFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>
</div>

<!-- Modal Advertencia (Herramientas no adaptadas) -->
<div id="warningModal" class="modal-overlay">
  <div style="background: var(--bg-card); padding: 20px; border-radius: 10px; max-width: 400px; border: 1px solid var(--border-color);">
    <h3 style="margin-top:0; color:#f87171;">Aviso de Herramienta Externa</h3>
    <p style="font-size: 13px; color: var(--text-muted); line-height:1.4;">
      Esta aplicación no cumple con los lineamientos oficiales de diseño de Nuninano. Es posible que no soporte temas oscuros ni configuraciones globales.
    </p>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="icon-btn" onclick="toggleModal('warningModal', false)">Cancelar</button>
      <button class="btn-primary" id="proceedWarningBtn">Continuar</button>
    </div>
  </div>
</div>

<script>
let apps = [];

window.addEventListener("DOMContentLoaded", () => {
  loadApps();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
});

async function loadApps() {
  try {
    const res = await fetch('apps.json');
    apps = await res.json();
  } catch (e) {
    apps = [
      {
        id: "editor-lrc",
        name: "Editor LRC Pro",
        creator: "Nuninano",
        type: "tool",
        url: "https://nuninano.github.io/Editor-LRC/",
        version: "v5",
        description: "Editor y sincronizador avanzado de letras (.LRC).",
        compliant: true
      }
    ];
  }
  renderApps();
}

function renderApps() {
  const grid = document.getElementById("projectsGrid");
  document.getElementById("appCountTag").textContent = `${apps.length} Disponibles`;
  grid.innerHTML = "";

  apps.sort((a, b) => (b.compliant === a.compliant) ? 0 : a.compliant ? -1 : 1);

  apps.forEach(app => {
    const card = document.createElement("div");
    card.className = "project-card";
    card.innerHTML = `
      <div>
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <h2 class="project-title">${app.name}</h2>
            <span class="project-creator">por ${app.creator || 'Anónimo'}</span>
          </div>
          <span class="badge ${app.compliant ? 'badge-compliant' : 'badge-non-compliant'}">
            ${app.compliant ? 'Adaptado' : 'No Adaptado'}
          </span>
        </div>
        <p class="project-desc" style="margin-top:10px;">${app.description}</p>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; color:var(--text-muted); font-family:monospace;">${app.type.toUpperCase()}</span>
        <button class="btn-primary" onclick="launchApp('${app.id}')">Abrir ↗</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function launchApp(id) {
  const app = apps.find(a => a.id === id);
  if (!app) return;

  if (app.compliant) {
    window.location.href = app.url;
  } else if (app.type === 'game') {
    openSandbox(app.url, app.name);
  } else {
    document.getElementById("proceedWarningBtn").onclick = () => {
      toggleModal('warningModal', false);
      openSandbox(app.url, app.name);
    };
    toggleModal('warningModal', true);
  }
}

function openSandbox(url, title) {
  document.getElementById("sandboxTitle").textContent = title;
  document.getElementById("sandboxFrame").src = url;
  toggleModal('sandboxModal', true);
}

function closeSandbox() {
  document.getElementById("sandboxFrame").src = "";
  toggleModal('sandboxModal', false);
}

function toggleModal(id, show) {
  document.getElementById(id).classList.toggle('open', show);
}
</script>

</body>
</html>
